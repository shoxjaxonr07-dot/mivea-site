<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIVEA Staff — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08080a; --panel:#111114; --panel-2:#17171b; --panel-3:#1d1d22;
    --line: rgba(255,255,255,0.09); --line-bright: rgba(255,255,255,0.18);
    --chrome:#c8ccd2; --white:#f7f7f8; --dim:#8d8f96;
    --blush:#f3b6c6; --blush-deep:#e78ba0; --blush-glow: rgba(243,182,198,0.14);
    --danger:#e8768a; --ok:#9fd6b0; --warn:#e8c876;
    --radius:2px;
    --font-display:'Syne','Manrope',sans-serif; --font-body:'Manrope',-apple-system,sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--void); color:var(--white); font-family:var(--font-body); font-size:14.5px; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:14px; }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline:2px solid var(--blush); outline-offset:2px; }
  ::selection{ background:var(--blush); color:#1a0d10; }

  /* ---------------- LOGIN ---------------- */
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:24px; }
  .login-screen::before{ content:''; position:absolute; inset:0; background:radial-gradient(ellipse 60% 50% at 50% 0%, var(--blush-glow), transparent 60%); pointer-events:none; }
  .login-card{ position:relative; z-index:1; width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line-bright); border-radius:var(--radius); padding:44px 36px; }
  .login-logo{ font-family:var(--font-display); font-weight:800; font-size:20px; letter-spacing:0.14em; text-align:center; }
  .login-logo span{ color:var(--blush); }
  .login-logo img{ height:64px; width:auto; display:block; margin:0 auto; }
  .side-logo img{ height:38px; width:auto; display:block; margin-bottom:10px; }
  .login-sub{ text-align:center; font-family:var(--font-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--dim); margin-top:8px; }
  .login-card .field{ margin-top:22px; }
  .demo-box{ margin-top:26px; border:1px dashed var(--line-bright); border-radius:var(--radius); padding:14px 16px; font-family:var(--font-mono); font-size:11.5px; color:var(--dim); line-height:1.7; }
  .demo-box b{ color:var(--chrome); }
  .login-err{ color:var(--danger); font-size:12.5px; margin-top:14px; text-align:center; display:none; }
  .login-err.show{ display:block; }

  /* ---------------- FIELD (shared) ---------------- */
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--chrome); margin-bottom:8px; letter-spacing:0.02em; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line-bright); color:var(--white); padding:11px 13px; border-radius:var(--radius);
  }
  .field textarea{ resize:vertical; min-height:80px; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--blush); }
  .btn{ display:inline-flex; align-items:center; gap:8px; padding:11px 20px; font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; border-radius:var(--radius); border:1px solid transparent; transition:.2s; }
  .btn-primary{ background:linear-gradient(135deg,var(--blush),var(--blush-deep)); color:#1a0d10; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--white); border:1px solid var(--line-bright); }
  .btn-ghost:hover{ border-color:var(--blush); color:var(--blush); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid rgba(232,118,138,0.4); }
  .btn-danger:hover{ background:rgba(232,118,138,0.08); }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:7px 12px; font-size:11px; }
  .lang-switch{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12px; letter-spacing:0.05em; }
  .lang-switch button{ background:none; border:none; color:var(--dim); padding:4px 6px; font-family:inherit; font-size:inherit; cursor:pointer; }
  .lang-switch button.active{ color:var(--white); font-weight:600; }
  .lang-switch .sep{ color:var(--line-bright); }

  /* ---------------- SHELL ---------------- */
  .shell{ display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  .sidebar{ background:var(--panel); border-right:1px solid var(--line); padding:24px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .side-logo{ font-family:var(--font-display); font-weight:800; font-size:17px; letter-spacing:0.12em; padding:8px 10px 26px; }
  .side-logo span{ color:var(--blush); }
  .side-logo small{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.16em; color:var(--dim); margin-top:4px; text-transform:uppercase; }
  .side-nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .side-nav button{ display:flex; align-items:center; gap:12px; background:none; border:none; color:var(--dim); text-align:left; padding:11px 12px; border-radius:var(--radius); font-size:13.5px; font-weight:600; }
  .side-nav button .ico{ font-size:15px; width:18px; text-align:center; }
  .side-nav button:hover{ background:var(--panel-2); color:var(--white); }
  .side-nav button.active{ background:var(--panel-2); color:var(--white); box-shadow:inset 2px 0 0 var(--blush); }
  .side-foot{ border-top:1px solid var(--line); padding-top:16px; margin-top:16px; }
  .side-user{ display:flex; align-items:center; gap:10px; padding:6px 10px 14px; }
  .avatar{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--blush),var(--blush-deep)); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; color:#1a0d10; font-weight:700; flex-shrink:0; }
  .side-user .name{ font-size:13px; font-weight:600; }
  .side-user .role{ font-size:11px; color:var(--dim); }

  .main{ padding:30px 36px 60px; max-width:1280px; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; flex-wrap:wrap; gap:14px; }
  .topbar h1{ font-size:24px; }
  .topbar .crumb{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; }

  /* ---------------- KPI ---------------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:34px; }
  @media(max-width:900px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; }
  .kpi .label{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); }
  .kpi .num{ font-family:var(--font-display); font-size:32px; margin-top:10px; }
  .kpi .sub{ font-size:11.5px; color:var(--dim); margin-top:6px; }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:26px; margin-bottom:24px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .panel-head h3{ font-size:16px; }

  /* ---------------- TABLE ---------------- */
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
  .toolbar input[type=text], .toolbar select{ background:var(--panel-2); border:1px solid var(--line-bright); color:var(--white); padding:9px 12px; border-radius:var(--radius); font-size:13px; }
  .toolbar input[type=text]{ min-width:200px; flex:1; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--dim); padding:10px 12px; border-bottom:1px solid var(--line-bright); }
  td{ padding:13px 12px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  tbody tr{ cursor:pointer; transition:background .15s; }
  tbody tr:hover{ background:var(--panel-2); }
  .id-mono{ font-family:var(--font-mono); font-size:12.5px; color:var(--chrome); }
  .empty-row td{ text-align:center; color:var(--dim); padding:40px 12px; }

  .badge{ display:inline-flex; align-items:center; padding:5px 11px; border-radius:99px; font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; border:1px solid var(--line-bright); white-space:nowrap; }
  .badge.ok{ border-color:var(--ok); color:var(--ok); }
  .badge.bad{ border-color:var(--danger); color:var(--danger); }
  .badge.mid{ border-color:var(--blush); color:var(--blush); }
  .badge.neutral{ border-color:var(--line-bright); color:var(--dim); }

  .cat-pill{ font-size:12px; color:var(--chrome); }

  /* ---------------- MODAL / DRAWER ---------------- */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:300; display:none; align-items:stretch; justify-content:flex-end; }
  .overlay.open{ display:flex; }
  .drawer{ width:min(560px, 94vw); background:var(--panel); border-left:1px solid var(--line-bright); height:100vh; overflow-y:auto; padding:30px 30px 60px; }
  .drawer-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .drawer-close{ background:none; border:1px solid var(--line-bright); color:var(--dim); width:32px; height:32px; border-radius:50%; font-size:15px; line-height:1; }
  .drawer-close:hover{ color:var(--white); border-color:var(--white); }
  .dgroup{ margin-bottom:24px; padding-bottom:24px; border-bottom:1px solid var(--line); }
  .dgroup:last-child{ border-bottom:none; }
  .dgroup h4{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--blush); margin-bottom:14px; }
  .drow{ display:flex; justify-content:space-between; gap:16px; padding:7px 0; font-size:13px; }
  .drow .k{ color:var(--dim); flex-shrink:0; }
  .drow .v{ text-align:right; }
  .dtext{ font-size:13.5px; color:var(--chrome); line-height:1.6; }

  .modal-center{ align-items:center; justify-content:center; }
  .modal{ width:min(520px, 94vw); max-height:90vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line-bright); border-radius:var(--radius); padding:30px; }
  .modal h3{ font-size:18px; margin-bottom:20px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); z-index:500; background:var(--panel-3); border:1px solid var(--line-bright); padding:13px 20px; border-radius:var(--radius); font-size:13px; opacity:0; pointer-events:none; transition:.25s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .note-box textarea{ min-height:70px; }
  .status-select{ margin-top:10px; }

  .tabs2{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
  .tab2{ padding:9px 16px; border:1px solid var(--line-bright); border-radius:99px; font-size:12px; color:var(--dim); font-weight:600; }
  .tab2.active{ background:var(--white); color:var(--void); border-color:var(--white); }

  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media(max-width:900px){ .grid3{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:600px){ .grid3{ grid-template-columns:1fr; } }
  .obj-card{ border:1px solid var(--line); background:var(--panel-2); border-radius:var(--radius); overflow:hidden; }
  .obj-cover{ aspect-ratio:4/3; background:linear-gradient(135deg,var(--panel-3),var(--void)); display:flex; align-items:center; justify-content:center; color:var(--dim); font-family:var(--font-mono); font-size:11px; }
  .obj-body{ padding:16px; }
  .obj-body h4{ font-size:14.5px; }
  .obj-body .meta{ font-size:11.5px; color:var(--dim); margin-top:5px; }
  .obj-actions{ display:flex; gap:8px; margin-top:14px; }

  .sidebar-toggle{ display:none; }
  @media(max-width:880px){
    .shell{ grid-template-columns:1fr; }
    .sidebar{ position:fixed; left:0; top:0; bottom:0; z-index:250; transform:translateX(-100%); transition:.25s; width:240px; }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-toggle{ display:inline-flex; }
    .main{ padding:22px 18px 50px; }
  }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

// Points at the reference-server from mivea-backend-design.zip.
// If it's unreachable at login time, the dashboard falls back to the
// local mock/demo data it always shipped with, so it still works standalone.
const API_BASE = 'https://miveaentertainment-official.onrender.com/api/v1';

async function apiFetch(path, opts){
  const headers = { 'Content-Type': 'application/json' };
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API_BASE + path, { headers, ...opts });
  let data = null;
  try { data = await res.json(); } catch {}
  if(!res.ok) throw new Error((data && data.error) || ('Request failed: ' + res.status));
  return data;
}

// Render's free tier sleeps after inactivity — the first request can take
// 30-50s to wake it and sometimes drops with "Failed to fetch" before the
// response arrives. Retry a few times with a delay instead of giving up.
async function apiFetchWithRetry(path, opts, { maxRetries = 3, delayMs = 6000, onRetry } = {}){
  let lastErr;
  for(let attempt = 0; attempt <= maxRetries; attempt++){
    try{
      return await apiFetch(path, opts);
    }catch(err){
      lastErr = err;
      const looksLikeColdStart = err.message === 'Failed to fetch' || err.message === 'Load failed' || err.name === 'TypeError';
      if(!looksLikeColdStart || attempt === maxRetries) throw err;
      if(onRetry) onRetry(attempt + 1, maxRetries);
      await new Promise(r => setTimeout(r, delayMs));
    }
  }
  throw lastErr;
}

function normalizeArtist(r){

}
function normalizeNews(r){
  return { id:r.id, tag:r.tag, title:r.title, date:(r.published_at||'').slice(0,10), desc:r.description };
}
async function loadLiveData(){
  const [apps, artists, news, staff, messages] = await Promise.all([
    apiFetch('/applications'),
    apiFetch('/artists/all'),
    apiFetch('/news'),
    apiFetch('/staff').catch(()=>null), // reviewer/editor roles can't read staff — not fatal
    apiFetch('/contact-messages').catch(()=>null)
  ]);
  state.applications = apps.map(normalizeApp);
  state.artists = artists.map(normalizeArtist);
  state.news = news.map(normalizeNews);
  if(staff) state.staff = staff.map(s=>({ id:s.id, name:s.name, email:s.email, role:s.role[0].toUpperCase()+s.role.slice(1) }));
  if(messages) state.messages = messages.map(m=>({ id:m.id, name:m.name, email:m.email, subject:m.subject||'', message:m.message, read:!!m.read, date:(m.created_at||'').slice(0,10) }));
}

async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const email = u.includes('@') ? u : (u + '@mivea.demo'); // matches the reference server's seeded demo account
  state.loggingIn = true; state.lastLoginError = null; state.wakingUp = false; render();
  try{
    const data = await apiFetchWithRetry(
      '/auth/login',
      { method:'POST', body: JSON.stringify({ email, password:p }) },
      { maxRetries: 3, delayMs: 6000, onRetry: ()=>{ state.wakingUp = true; render(); } }
    );
    state.token = data.token;
    state.offlineMode = false;
    await loadLiveData();
    state.authed = true; state.loginError = false;
  }catch(networkOrAuthErr){
    // Backend unreachable, or these creds don't exist there — fall back to
    // the built-in offline demo login so the dashboard still works standalone.
    state.lastLoginError = networkOrAuthErr.message || 'Unknown error';
    if(u==='admin' && p==='mivea2026'){
      state.authed = true; state.loginError = false; state.offlineMode = true;
    } else {
      state.loginError = true;
    }
  }
  state.loggingIn = false; state.wakingUp = false;
  render();
}

}

/* ---------------- OVERVIEW ---------------- */
function renderOverview(){
  const tt = t();
  const apps = state.applications;
  const total = apps.length;
  const review = apps.filter(a=>['UNDER_REVIEW','SHORTLISTED','ONLINE_AUDITION','FINAL_EVALUATION'].includes(a.status)).length;
  const accepted = apps.filter(a=>a.status==='ACCEPTED').length;
  const notSel = apps.filter(a=>a.status==='NOT_SELECTED').length;

  const byCat = {};
  apps.forEach(a=>{ byCat[a.category] = (byCat[a.category]||0)+1; });

  const recent = [...apps].sort((a,b)=> b.submitted.localeCompare(a.submitted)).slice(0,5);

  return `
  <div class="topbar">
    <div><p class="crumb">${esc(tt.overview.crumb)}</p><h1>${esc(tt.overview.title)}</h1></div>
  </div>
  <div class="kpi-grid">
    <div class="kpi"><p class="label">${esc(tt.overview.kpiTotal)}</p><p class="num">${total}</p><p class="sub">${esc(tt.overview.kpiTotalSub)}</p></div>
    <div class="kpi"><p class="label">${esc(tt.overview.kpiReview)}</p><p class="num">${review}</p><p class="sub">${esc(tt.overview.kpiReviewSub)}</p></div>
    <div class="kpi"><p class="label">${esc(tt.overview.kpiAccepted)}</p><p class="num">${accepted}</p><p class="sub">${esc(tt.overview.kpiAcceptedSub)}</p></div>
    <div class="kpi"><p class="label">${esc(tt.overview.kpiNotSel)}</p><p class="num">${notSel}</p><p class="sub">${esc(tt.overview.kpiNotSelSub)}</p></div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>${esc(tt.overview.byCategory)}</h3></div>
    <div class="grid3">
      ${CATEGORY_KEYS.map(k=>`
        <div class="obj-card" style="background:var(--panel-2);">
          <div class="obj-body">
            <div class="cat-pill">${esc(tt.category[k])}</div>
            <h4 style="margin-top:8px; font-family:var(--font-mono); font-size:22px;">${byCat[k]||0}</h4>
          </div>
        </div>`).join('')}
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>${esc(tt.overview.recent)}</h3><button type="button" class="btn btn-ghost btn-sm" data-goto="applications">${esc(tt.overview.viewAll)}</button></div>
    <table>
      <thead><tr><th>${esc(tt.overview.colId)}</th><th>${esc(tt.overview.colName)}</th><th>${esc(tt.overview.colCategory)}</th><th>${esc(tt.overview.colCountry)}</th><th>${esc(tt.overview.colStatus)}</th></tr></thead>
      <tbody>
        ${recent.map(a=>`
          <tr data-open-app="${a.id}">
            <td class="id-mono">${esc(a.id)}</td>
            <td>${esc(a.fullName)}</td>
            <td class="cat-pill">${tt.category[a.category]||'—'}</td>
            <td>${esc(a.country)}</td>
            <td><span class="badge ${badgeClass(a.status)}">${tt.status[a.status]}</span></td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ---------------- APPLICATIONS LIST ---------------- */
function renderApplications(){
  const tt = t();
  const f = state.appFilter;
  let rows = state.applications.filter(a=>{
    if(f.status && a.status!==f.status) return false;
    if(f.category && a.category!==f.category) return false;
    if(f.q && !(a.fullName.toLowerCase().includes(f.q.toLowerCase()) || a.id.toLowerCase().includes(f.q.toLowerCase()))) return false;
    return true;
  });

  return `
  <div class="topbar">
    <div><p class="crumb">${esc(tt.applications.crumb)}</p><h1>${esc(tt.applications.title)}</h1></div>
  </div>
  <div class="panel">
    <div class="toolbar">
      <input type="text" id="appSearch" placeholder="${esc(tt.applications.search)}" value="${esc(f.q)}">
      <select id="appStatusFilter">
        <option value="">${esc(tt.applications.allStatuses)}</option>
        ${STATUS_ORDER.map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${tt.status[s]}</option>`).join('')}
      </select>
      <select id="appCatFilter">
        <option value="">${esc(tt.applications.allCategories)}</option>
        ${CATEGORY_KEYS.map(k=>`<option value="${k}" ${f.category===k?'selected':''}>${tt.category[k]}</option>`).join('')}
      </select>
    </div>
    <table>
      <thead><tr><th>${esc(tt.overview.colId)}</th><th>${esc(tt.overview.colName)}</th><th>${esc(tt.overview.colCategory)}</th><th>${esc(tt.overview.colCountry)}</th><th>${esc(tt.applications.colSubmitted)}</th><th>${esc(tt.overview.colStatus)}</th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(a=>`
          <tr data-open-app="${a.id}">
            <td class="id-mono">${esc(a.id)}</td>
            <td>${esc(a.fullName)}</td>
            <td class="cat-pill">${tt.category[a.category]||'—'}</td>
            <td>${esc(a.country)}</td>
            <td>${esc(a.submitted)}</td>
            <td><span class="badge ${badgeClass(a.status)}">${tt.status[a.status]}</span></td>
          </tr>`).join('') : `<tr class="empty-row"><td colspan="6">${esc(tt.applications.empty)}</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

function renderMaterialRow(label, value, kind){
  if(!value){
    return `<div class="drow"><span class="k">${esc(label)}</span><span class="v">—</span></div>`;
  }
  const isUrl = /^https?:\/\//i.test(value);
  if(!isUrl){
    // Older/offline-mode record — only a filename was ever stored, nothing to preview.
    return `<div class="drow"><span class="k">${esc(label)}</span><span class="v">${esc(value)}</span></div>`;
  }
  let preview = '';
  if(kind==='image'){
    preview = `<img src="${esc(value)}" alt="${esc(label)}" style="max-width:100%; max-height:220px; border-radius:2px; margin-top:8px; display:block;">`;
  } else if(kind==='video'){
    preview = `<video src="${esc(value)}" controls style="max-width:100%; max-height:260px; border-radius:2px; margin-top:8px; display:block; background:#000;"></video>`;
  }
  return `<div style="margin-bottom:14px;">
    <div class="drow" style="border-bottom:none; padding-bottom:0;">
      <span class="k">${esc(label)}</span>
      <span class="v"><a href="${esc(value)}" target="_blank" rel="noopener" style="color:var(--blush);">Open ↗</a></span>
    </div>
    ${preview}
  </div>`;
}

/* ---------------- MAIN RENDER ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!state.authed){ app.innerHTML = renderLogin(); return; }

  let page = '';
  switch(state.route){
    case 'overview': page = renderOverview(); break;
    case 'applications': page = renderApplications(); break;
    case 'artists': page = renderArtists(); break;
    case 'news': page = renderNews(); break;
    case 'staff': page = renderStaff(); break;
    case 'messages': page = renderMessages(); break;
    case 'settings': page = renderSettings(); break;
    default: page = renderOverview();
  }

  app.innerHTML = `
    <div class="shell">
      ${renderSidebar()}
      <div class="main">
        <button type="button" class="btn btn-ghost btn-sm sidebar-toggle" data-action="toggle-sidebar" style="margin-bottom:16px;">☰ Menu</button>
        ${page}
      </div>
    </div>
    ${state.activeAppId ? renderAppDrawer() : ''}
    ${renderModal()}
  `;
}

/* ---------------- MUTATIONS (API when online, local when offline) ---------------- */
async function persistStaff(draft){
  if(state.offlineMode){
    state.staff.push({ id: uid('st'), name: draft.name, email: draft.email, role: draft.role[0].toUpperCase()+draft.role.slice(1) });
  } else {
    try{
      const saved = await apiFetch('/staff', { method:'POST', body: JSON.stringify(draft) });
      state.staff.push({ id: saved.id, name: saved.name, email: saved.email, role: saved.role[0].toUpperCase()+saved.role.slice(1) });
    }catch(err){ toast(err.message); return; }
  }
  state.modal = null;
  render();
  toast(t().staff.added);
}

async function markMessageRead(id){
  const msg = state.messages.find(m=>m.id===id);
  if(!msg) return;
  if(state.offlineMode){
    msg.read = true;
  } else {
    try{ await apiFetch(`/contact-messages/${encodeURIComponent(id)}`, { method:'PATCH' }); msg.read = true; }
    catch(err){ toast(err.message); return; }
  }
  render();
}

async function saveAppStatus(status, staffNote){
  const app = state.applications.find(a=>a.id===state.activeAppId);
  if(!app){ state.activeAppId=null; render(); return; }
  if(state.offlineMode){
    app.status = status; app.staffNote = staffNote;
  } else {
    try{
      const updated = await apiFetch(`/applications/${encodeURIComponent(app.id)}`, {
        method:'PATCH', body: JSON.stringify({ status, staffNote })
      });
      Object.assign(app, normalizeApp(updated));
    }catch(err){ toast(err.message); return; }
  }
  state.activeAppId = null;
  render();
  toast(t().drawer.updated);
}

async function removeArtist(id){
  if(state.offlineMode){
    state.artists = state.artists.filter(a=>a.id!==id);
  } else {
    try{ await apiFetch(`/artists/${encodeURIComponent(id)}`, { method:'DELETE' }); state.artists = state.artists.filter(a=>a.id!==id); }
    catch(err){ toast(err.message); return; }
  }
  render();
  toast(t().artists.removed);
}

async function persistArtist(draft, mode){
  if(state.offlineMode){
    const updated = { ...draft, id: draft.id || uid('art') };
    if(mode==='add'){ state.artists.push(updated); }
    else { state.artists = state.artists.map(a=> a.id===updated.id ? updated : a); }
    state.artistTab = updated.type;
  } else {
    try{
      const body = JSON.stringify(draft);
      const saved = mode==='add'
        ? await apiFetch('/artists', { method:'POST', body })
        : await apiFetch(`/artists/${encodeURIComponent(draft.id)}`, { method:'PATCH', body });
      const norm = normalizeArtist(saved);
      if(mode==='add'){ state.artists.push(norm); } else { state.artists = state.artists.map(a=> a.id===norm.id ? norm : a); }
      state.artistTab = norm.type;
    }catch(err){ toast(err.message); return; }
  }
  state.modal = null;
  render();
  toast(t().artists.saved);
}

async function removeNews(id){
  if(state.offlineMode){
    state.news = state.news.filter(n=>n.id!==id);
  } else {
    try{ await apiFetch(`/news/${encodeURIComponent(id)}`, { method:'DELETE' }); state.news = state.news.filter(n=>n.id!==id); }
    catch(err){ toast(err.message); return; }
  }
  render();
  toast(t().news.removed);
}

async function persistNews(draft, mode){
  if(state.offlineMode){
    const updated = { ...draft, id: draft.id || uid('news') };
    if(mode==='add'){ state.news.unshift(updated); } else { state.news = state.news.map(n=> n.id===updated.id ? updated : n); }
  } else {
    try{
      const body = JSON.stringify(draft);
      const saved = mode==='add'
        ? await apiFetch('/news', { method:'POST', body })
        : await apiFetch(`/news/${encodeURIComponent(draft.id)}`, { method:'PATCH', body });
      const norm = normalizeNews(saved);
      if(mode==='add'){ state.news.unshift(norm); } else { state.news = state.news.map(n=> n.id===norm.id ? norm : n); }
    }catch(err){ toast(err.message); return; }
  }
  state.modal = null;
  render();
  toast(t().news.saved);
}

/* ---------------- EVENTS ---------------- */
document.addEventListener('click', (e)=>{
  const loginBtn = e.target.closest('[data-action="login"]');
  if(loginBtn){ doLogin(); return; }

  const langBtn = e.target.closest('[data-lang]');
  if(langBtn){ state.lang = langBtn.getAttribute('data-lang'); render(); return; }

  const logoutBtn = e.target.closest('[data-action="logout"]');
  if(logoutBtn){ state.authed=false; state.token=null; state.offlineMode=false; state.route='overview'; render(); return; }

  const gotoBtn = e.target.closest('[data-goto]');
  if(gotoBtn){ state.route = gotoBtn.getAttribute('data-goto'); state.sidebarOpen=false; render(); return; }

  const toggleSide = e.target.closest('[data-action="toggle-sidebar"]');
  if(toggleSide){ state.sidebarOpen = !state.sidebarOpen; render(); return; }

  const openApp = e.target.closest('[data-open-app]');
  if(openApp){
    state.activeAppId = openApp.getAttribute('data-open-app');
    const app = state.applications.find(a=>a.id===state.activeAppId);
    state.activeAppDraftStatus = app ? app.status : null;
    state.activeAppDraftNote = app ? app.staffNote : '';
    render();
    return;
  }
  const closeDrawer = e.target.closest('[data-action="close-drawer"]');
  if(closeDrawer && e.target===closeDrawer){ state.activeAppId=null; render(); return; }

  const saveStatus = e.target.closest('[data-action="save-status"]');
  if(saveStatus){
    saveAppStatus(document.getElementById('statusSelect').value, document.getElementById('staffNote').value);
    return;
  }

  const artistTab = e.target.closest('[data-action="artist-tab"]');
  if(artistTab){ state.artistTab = artistTab.getAttribute('data-value'); render(); return; }

  const openStaffModal = e.target.closest('[data-action="open-staff-modal"]');
  if(openStaffModal){
    state.modal = { type:'staff', mode:'add', data:{ name:'', email:'', password:'', role:'reviewer' } };
    render();
    return;
  }
  const saveStaffBtn = e.target.closest('[data-action="save-staff"]');
  if(saveStaffBtn){
    const draft = {
      name: document.getElementById('mStaffName').value.trim(),
      email: document.getElementById('mStaffEmail').value.trim(),
      password: document.getElementById('mStaffPassword').value.trim(),
      role: document.getElementById('mStaffRole').value
    };
    if(!draft.name || !draft.email || !draft.password || !draft.role){ toast(t().staff.allFieldsRequired); return; }
    persistStaff(draft);
    return;
  }
  const markReadBtn = e.target.closest('[data-action="mark-message-read"]');
  if(markReadBtn){ markMessageRead(markReadBtn.getAttribute('data-id')); return; }

  const openArtistModal = e.target.closest('[data-action="open-artist-modal"]');
  if(openArtistModal){
    const mode = openArtistModal.getAttribute('data-mode');
    let data = { type: state.artistTab, name:'', members:'', debut:'', position:'', bio:'', discography:'', mv:'' };
    if(mode==='edit'){
      const found = state.artists.find(a=>a.id===openArtistModal.getAttribute('data-id'));
      if(found) data = {...found};
    }
    state.modal = { type:'artist', mode, data };
    render();
    return;
  }
  const deleteArtist = e.target.closest('[data-action="delete-artist"]');
  if(deleteArtist){ removeArtist(deleteArtist.getAttribute('data-id')); return; }
  const saveArtist = e.target.closest('[data-action="save-artist"]');
  if(saveArtist){
    const d = state.modal.data;
    const draft = {
      id: d.id || null,
      type: document.getElementById('mArtistType').value,
      name: document.getElementById('mArtistName').value.trim(),
      members: document.getElementById('mArtistMembers').value.trim(),
      debut: document.getElementById('mArtistDebut').value.trim(),
      position: document.getElementById('mArtistPosition').value.trim(),
      bio: document.getElementById('mArtistBio').value.trim(),
      discography:'', mv:''
    };
    if(!draft.name){ toast(t().artists.nameRequired); return; }
    persistArtist(draft, state.modal.mode);
    return;
  }

  const openNewsModal = e.target.closest('[data-action="open-news-modal"]');
  if(openNewsModal){
    const mode = openNewsModal.getAttribute('data-mode');
    let data = { tag:'Mivea News', title:'', date:'', desc:'' };
    if(mode==='edit'){
      const found = state.news.find(n=>n.id===openNewsModal.getAttribute('data-id'));
      if(found) data = {...found};
    }
    state.modal = { type:'news', mode, data };
    render();
    return;
  }
  const deleteNews = e.target.closest('[data-action="delete-news"]');
  if(deleteNews){ removeNews(deleteNews.getAttribute('data-id')); return; }
  const saveNews = e.target.closest('[data-action="save-news"]');
  if(saveNews){
    const d = state.modal.data;
    const draft = {
      id: d.id || null,
      tag: document.getElementById('mNewsTag').value,
      date: document.getElementById('mNewsDate').value,
      title: document.getElementById('mNewsTitle').value.trim(),
      desc: document.getElementById('mNewsDesc').value.trim()
    };
    if(!draft.title){ toast(t().news.titleRequired); return; }
    persistNews(draft, state.modal.mode);
    return;
  }

  const closeModal = e.target.closest('[data-action="close-modal"]');
  if(closeModal && e.target===closeModal){ state.modal=null; render(); return; }
});

document.addEventListener('change', (e)=>{
  if(e.target.id==='appStatusFilter'){ state.appFilter.status = e.target.value; render(); }
  if(e.target.id==='appCatFilter'){ state.appFilter.category = e.target.value; render(); }
});
document.addEventListener('input', (e)=>{
  if(e.target.id==='appSearch'){ state.appFilter.q = e.target.value; render(); }
});

render();
</script>
</body>
</html>
